<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <!-- School Bench / Exam Desk Illustration -->
  <g fill="#ffffff" transform="translate(64, 64) scale(0.75)">
    <!-- Desk Top -->
    <rect x="40" y="140" width="432" height="40" rx="12" fill="#ffffff" />
    <!-- Desk Legs -->
    <rect x="80" y="180" width="24" height="200" rx="6" fill="#e0e7ff" />
    <rect x="408" y="180" width="24" height="200" rx="6" fill="#e0e7ff" />
    <rect x="80" y="300" width="352" height="16" rx="4" fill="#c7d2fe" />
    <!-- Paper / Exam Sheet -->
    <rect x="180" y="60" width="152" height="110" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="8" />
    <line x1="205" y1="90" x2="307" y2="90" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" />
    <line x1="205" y1="115" x2="307" y2="115" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" />
    <line x1="205" y1="140" x2="270" y2="140" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" />
    <!-- Checkmark Badge -->
    <circle cx="360" cy="80" r="36" fill="#10b981" />
    <path d="M346 80 L356 90 L376 70" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
